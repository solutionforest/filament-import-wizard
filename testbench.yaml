env:
  - APP_KEY=base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
  - DB_CONNECTION=sqlite
  - QUEUE_CONNECTION=sync
  - SESSION_DRIVER=file
  - CACHE_STORE=file
  - APP_URL=http://127.0.0.1:8765

providers:
  - Filament\FilamentServiceProvider
  - Filament\Actions\ActionsServiceProvider
  - Filament\Forms\FormsServiceProvider
  - Filament\Infolists\InfolistsServiceProvider
  - Filament\Notifications\NotificationsServiceProvider
  - Filament\Schemas\SchemasServiceProvider
  - Filament\Support\SupportServiceProvider
  - Filament\Tables\TablesServiceProvider
  - Livewire\LivewireServiceProvider
  - SolutionForest\FilamentImportWizard\ImportWizardServiceProvider
  - Workbench\App\Providers\AdminPanelProvider

migrations:
  - workbench/database/migrations
  - vendor/filament/actions/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: /admin
  install: true
  health: false
  discovers:
    web: false
    api: false
    commands: false
    components: false
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets: []
  sync: []
