name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: What did you do, what did you expect, what happened instead? }
    validations: { required: true }
  - type: input
    id: versions
    attributes: { label: Versions, description: 'Package, PHP, Laravel, Filament, Livewire (composer show)', placeholder: '0.10.1 / 8.4 / 12.x / 5.x / 4.x' }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Reproduction, description: 'A minimal importer and a small file (anonymised) that shows it' }
  - type: textarea
    id: logs
    attributes: { label: Logs / screenshots }
